services:
  - type: web
    name: attendance-ml
    env: python
    plan: free
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "app:create_app()" -b 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URI
        fromDatabase:
          name: attendance-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FLASK_APP
        value: app
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: attendance-db
    plan: free
