<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ML Attendance System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body class="{{ 'auth-page' if not current_user.is_authenticated else '' }}">
    <div class="app-container">
        {% if current_user.is_authenticated %}
        <!-- Sidebar -->
        {% block sidebar %}
        <aside class="sidebar">
            <div class="brand">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
                </svg>
                AttendanceML
            </div>

            <ul class="nav-links">
                <li class="nav-item">
                    <a href="{{ url_for('main.dashboard') }}"
                        class="{{ 'active' if request.endpoint == 'main.dashboard' }}">
                        <span>📊</span> Dashboard
                    </a>
                </li>
            </ul>

            <div class="user-profile">
                <div class="user-avatar">{{ current_user.name[0] | upper }}</div>
                <div style="flex: 1; overflow: hidden;">
                    <p style="font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{
                        current_user.name }}</p>
                    <a href="{{ url_for('auth.logout') }}"
                        style="font-size: 0.8rem; color: var(--error-color); text-decoration: none;">Logout</a>
                </div>
            </div>
        </aside>
        {% endblock %}
        {% endif %}

        <!-- Main Content -->
        <main class="main-content">
            {% block content %}{% endblock %}
        </main>
    </div>
</body>

</html>
